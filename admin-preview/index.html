<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CMS Demo — Dejan Tumenko</title>
  <link href="/assets/images/image-882b5959.png" rel="icon" media="(prefers-color-scheme: light)">
  <link href="/assets/images/image-863a9fee.png" rel="icon" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/cms.css">
</head>
<body>
  <div id="cms-root"></div>

  <script>
    // Demo rezim: isti panel, ali bez GitHub-a. Podaci se citaju sa samog
    // sajta (content/*.json su staticki fajlovi), pa se vidi stvarno stanje;
    // Publish i brisanje prolaze kroz UI ali ne upisuju nista, a refresh
    // vraca sve na pocetak.
    window.CMS_CONFIG = {
      demo: true,
      repo: "Chevu13/Deki-sajt",
      branch: "main",
      siteUrl: "https://www.dtumenko.com",
      contentDir: "content/work",
      legacyFile: "content/legacy-work.json",
      legacyImagesFile: "content/legacy-images.json",
      pagesFile: "content/pages.json",
      mediaFolder: "assets/uploads",
      publicFolder: "/assets/uploads",
    };
  </script>
  <script src="/admin/cms.js"></script>
</body>
</html>
