<!--CMS_HEAD-->
<link rel="stylesheet" href="/assets/cms.css">
</head>
<body>
<div id="cms-menu-overlay" class="cms-menu-overlay" data-cms-menu-overlay>
  <button class="cms-menu-overlay__close" type="button" data-cms-menu-close>Close</button>
  <nav class="cms-menu-overlay__links">
    <a href="/">Home</a>
    <a href="/work">Works</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </nav>
</div>
<div class="cms-nav"><!--CMS_NAV--></div>
<main class="cms-main">
  <header class="cms-hero">
    <div class="cms-hero__media"><img src="{{HERO_IMAGE}}" alt="{{TITLE}}" style="object-position:{{HERO_FOCUS}}"></div>
    <a class="cms-hero__back" href="/work">View All</a>
    <h1 class="cms-hero__title">{{TITLE}}</h1>
  </header>

  <div class="cms-project">
    <div class="cms-project__media">
{{GALLERY_ITEMS}}
    </div>
    <aside class="cms-project__info">
      <div class="cms-info__block">
        <h2 class="cms-info__title">{{TITLE}}</h2>
        <p class="cms-info__year">{{YEAR}}</p>
      </div>
      <div class="cms-info__block">
        <p class="cms-info__label">Overview</p>
        <p class="cms-info__text">{{PROJECT_OVERVIEW}}</p>
      </div>
{{SERVICE_LIST}}
{{LIVE_LINK_BLOCK}}
    </aside>
  </div>
</main>
<!--CMS_FOOTER-->
<script src="/assets/cms.js" defer></script>
</body>
</html>
